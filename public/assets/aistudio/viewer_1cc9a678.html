
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trainer Collection Report</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{--night:#0b1626;--deep:#10223a;--card:#162c48;--card2:#1d3858;--line:#2a4666;--tx:#eef4ff;--mu:#8ea3bf;--gold:#ffcb05;--ball:#ee1515;--blue:#3d7dff;--ok:#3fd06a;--bad:#ff5a5f;--warn:#ffc94a;
--hd:"Fredoka","Trebuchet MS",system-ui,sans-serif;--bd:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--night) radial-gradient(900px 500px at 85% -5%,rgba(61,125,255,.22),transparent 60%) fixed;color:var(--tx);font:15px/1.5 var(--bd)}
h1,h2,h3{font-family:var(--hd);margin:0;font-weight:600}
button,input,select{font:inherit;color:inherit}
.hero{max-width:1300px;margin:0 auto;padding:30px 20px 8px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ball{width:76px;height:76px;border-radius:50%;flex:none;border:5px solid #08111d;background:linear-gradient(#f43 0 44%,#08111d 44% 56%,#f7f9fc 56%);position:relative;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.ball::after{content:"";position:absolute;inset:50% auto auto 50%;width:24px;height:24px;margin:-12px;border-radius:50%;background:#f7f9fc;border:5px solid #08111d}
.hero h1{font-size:34px;line-height:1.1}.hero p{margin:4px 0 0;color:var(--mu)}
nav{position:sticky;top:0;z-index:10;background:rgba(11,22,38,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav div{max-width:1300px;margin:0 auto;padding:8px 14px;display:flex;gap:6px;overflow-x:auto}
nav button{background:none;border:0;border-radius:99px;padding:8px 18px;font:600 16px var(--hd);color:var(--mu);cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--tx)}nav button.on{background:var(--gold);color:#241a00}
main{max-width:1300px;margin:0 auto;padding:22px 20px 60px}
h2{font-size:24px;margin:30px 0 4px}h2:first-child{margin-top:0}.sub{color:var(--mu);margin:0 0 14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border:2px solid var(--line);border-top:6px solid var(--c);border-radius:18px;padding:12px 14px;text-align:left;cursor:pointer}
.tile:hover{border-color:var(--c)}.tile b{display:block;font:700 34px/1.1 var(--hd);color:var(--c)}.tile span{color:var(--mu);font-size:13px;font-weight:700}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 13px;font-weight:700;font-size:14px}.pill b{color:var(--gold);margin-right:5px}
.pill.gap{border-color:var(--bad)}.pill.ok{border-color:var(--ok)}
.note{background:var(--deep);border-left:4px solid var(--gold);border-radius:8px;padding:8px 14px;margin:8px 0;color:#c9d7ea}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input[type=search]{flex:1 1 260px;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:10px 18px}
.bar input:focus,.bar select:focus{outline:2px solid var(--gold);outline-offset:1px}
.bar select,.btn{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:8px 16px;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--gold)}.btn.pri{background:var(--gold);color:#241a00;border-color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:99px;padding:4px 12px;cursor:pointer;user-select:none;font-weight:700;font-size:13px;background:var(--card)}
.chip:has(input:checked){border-color:var(--c,var(--gold));background:var(--card2)}.chip input{accent-color:var(--c,var(--gold));margin:0}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.card .top{background:linear-gradient(135deg,var(--t),#0c1a2c 150%);padding:12px 14px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;flex-wrap:wrap}
.vb{font:600 12px var(--hd);letter-spacing:.04em;padding:3px 10px;border-radius:99px;background:var(--v);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.st{font:700 11px var(--hd);letter-spacing:.03em;padding:3px 10px;border-radius:99px;background:var(--v);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.3);white-space:nowrap}
.st[data-s="Ready"]{background:#3fd06a;color:#0b2412}
.st[data-s="Needs TM"]{background:#ffc94d;color:#2e2100}
.st[data-s="Needs second charged move"]{background:#ff9f45;color:#2e1400}
.st[data-s="Needs Elite TM"]{background:#a878ff;color:#1a0033}
.st[data-s="Unknown"]{background:#6b7a8d;color:#fff}
.cp{text-align:right;font:700 30px/1 var(--hd);text-shadow:0 2px 0 rgba(0,0,0,.35)}.cp small{font-size:13px;margin-right:4px;opacity:.85}
.body{padding:0 14px 14px;margin-top:-8px;display:flex;flex-direction:column;gap:9px;flex:1}
.card h3{font-size:21px;line-height:1.15}.badge{display:inline-block;font:700 10px var(--bd);padding:1px 7px;border-radius:5px;margin-left:5px;vertical-align:middle;color:#fff;background:#5d708a}
.role{margin:0;color:var(--mu);font-size:13px}
.ivs{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;font-size:12px;font-weight:800;color:var(--mu)}
.ivs .tr{height:7px;background:#0d1b2e;border-radius:9px;overflow:hidden}.ivs .tr i{display:block;height:100%;background:var(--ok)}.ivs .tr i.m{background:var(--warn)}.ivs .tr i.l{background:var(--bad)}
.ivs em{font-style:normal;color:var(--tx)}
.mvs{display:flex;flex-wrap:wrap;gap:5px}.mv{background:var(--c,#777);color:#fff;font-weight:800;font-size:12.5px;padding:2px 10px;border-radius:99px;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.need{font-size:12px;color:var(--warn);font-weight:700}.plan{font-size:13px;font-weight:700;color:#bfe1ff}
details{font-size:13px;color:var(--mu)}summary{cursor:pointer;font-weight:700;color:var(--tx)}details p{margin:6px 0 0}
.more{display:block;margin:22px auto 0}.empty{padding:50px;text-align:center;color:var(--mu)}
.panels{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px}
.panel h3{font-size:19px;display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.grade{background:var(--g,var(--gold));color:#111;font:700 18px var(--hd);width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);align-items:center}
.row:first-of-type{border-top:0}.row small{display:block;color:var(--mu);font-size:12px}.row .r{text-align:right;white-space:nowrap;font-weight:800;font-size:13px}
.tag{font-size:11px;font-weight:800;padding:1px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);margin-left:4px;white-space:nowrap}
.tabs2{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.drop{max-width:520px;margin:60px auto;background:var(--card);border:3px dashed var(--line);border-radius:24px;padding:36px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);background:var(--gold);color:#241a00;font-weight:800;padding:10px 20px;border-radius:99px;transition:transform .2s;z-index:50}.toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:600px){.hero h1{font-size:26px}.ball{width:56px;height:56px}main{padding:16px 12px 50px}}
.sc{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--c);color:#111;font:800 11px var(--bd);white-space:nowrap}
.pb{height:7px;background:#0d1b2e;border-radius:9px;overflow:hidden;margin:5px 0}.pb i{display:block;height:100%}
.btn.sm{padding:2px 10px;font-size:12px;margin-left:6px}
button.tilep{text-align:left;width:100%;cursor:pointer;color:inherit;font:inherit}button.tilep:hover{border-color:var(--gold)}
.grade{width:auto;min-width:34px;padding:0 9px;border-radius:99px}
.panel h3 .btn.sm{font-weight:700}
</style></head><body>
<div class="hero"><div class="ball"></div><div><h1>Pokémon GO Sorter</h1><p id="meta">Loading…</p></div></div>
<nav><div id="nav"></div></nav>
<main id="app"></main><div class="toast" id="toast"></div>
<script>
window.__REPORT__ = /*__REPORT_JSON__*/ null;
const TC={normal:"#8a8d91",fire:"#e8590c",water:"#2f7de1",electric:"#d9a200",grass:"#3a9d3a",ice:"#38a8b8",fighting:"#c0392b",poison:"#9b4dca",ground:"#a9792b",flying:"#6c8ae4",psychic:"#e0507f",bug:"#8aa31d",rock:"#a39350",ghost:"#6a5a9e",dragon:"#4a52d6",dark:"#5a4a42",steel:"#6b8794",fairy:"#d96fb0"};
const VC={BUILD_PVP:"#ff5fa2",BUILD_MEGA:"#ffb300",BUILD_RAID:"#ff7a45",BUILD_MAX:"#a878ff",BUILD_GYM:"#35d0ea",KEEP:"#3fd06a",REVIEW:"#ffc94a",TRANSFER:"#ff5a5f"};
const VN={BUILD_PVP:"Train for PvP",BUILD_MEGA:"Build Mega",BUILD_RAID:"Train for raids",BUILD_MAX:"Train for Max Battles",BUILD_GYM:"Gym defender",KEEP:"Keep",REVIEW:"Check this",TRANSFER:"Safe to transfer"};
const STORDER=["Ready","Needs TM","Needs second charged move","Needs Elite TM","Unknown"];
const ORDER=Object.keys(VC),TABS=[["today","Today"],["out","Transfer"],["plan","Build plan"],["wish","Wishlist"],["raid","Raid"],["max","Max Battles"],["pvp","PvP"],["mega","Megas"],["showcase","Showcase"],["depth","Collection"],["grade","Grade"],["mons","All Pokémon"],["home","Overview"],["settings","Settings"]];
const $=s=>document.querySelector(s);
const e=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=n=>Number(n||0).toLocaleString();
const tc=t=>TC[String(t||"").toLowerCase()]||"#777";
let R,M,st={tab:"today",v:new Set(ORDER),q:"",needs:false,elite:false,ready:false,sort:"build_status",shown:60,sf:"all"};
const mvChip=x=>x?`<span class="mv" style="--c:${tc(x.type)}">${e(x.name)}${x.elite?" ★":""}</span>`:"";
const toast=t=>{const x=$("#toast");x.textContent=t;x.classList.add("on");setTimeout(()=>x.classList.remove("on"),2200)};
const copy=(s,msg)=>{(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast(msg),()=>prompt("Copy this:",s))};
const tip=(title,body)=>`<div class="panel" style="border-left:4px solid var(--gold);margin-bottom:12px"><h3 style="margin:0 0 6px">${title}</h3><div class="role">${body}</div></div>`;
const gloss={
 IV:"IVs are hidden Attack / Defence / HP stats from 0 to 15. Higher is usually better for raids.",
 CP:"Combat Power — how strong the Pokémon is right now. Raising its level costs Stardust and candy.",
 XL:"XL candy is needed to power above level 40. Expensive — save it for Pokémon you use a lot.",
 Max:"Max Battles need Dynamax or Gigantamax Pokémon. Normal Pokémon do not count here.",
 Mega:"Mega Evolution temporarily powers up a Pokémon and boosts teammates of the same type in raids.",
 Dust:"Stardust is the main cost to power up. Earn it from catches, raids, and friends.",
 Transfer:"Sending a Pokémon to the Professor removes it and gives candy. Favourites are never listed as safe transfers."
};

function init(r){R=r;
 M=(R.mons||[]).map(m=>{const mv=m.moves||[],g=s=>mv.find(x=>x.slot===s);const f=g("fast");
  return Object.assign({},m,{name:m.species+(m.form&&m.form!==m.species?" ("+m.form.replace(m.species,"")+")":""),fast:f,c1:g("charged"),c2:g("charged2"),
   ty:f?f.type:(m.raid_type||m.max_type||m.mega_type||"normal").toLowerCase(),
   plan:[m.evolve_to?"Evolve into "+m.evolve_to:"",m.power_up_to?"Power up to L"+m.power_up_to+(m.build_cp?" (CP ~"+m.build_cp+")":""):""].filter(Boolean).join(" · "),
   text:[m.species,m.form,m.role,m.why,m.build_status||"",(m.flags||[]).join(" "),m.verdict,VN[m.verdict],mv.map(x=>x.name).join(" "),m.best_pvp,(m.warnings||[]).join(" ")].join(" ").toLowerCase()})});
 const mt=R.meta||{};$("#meta").textContent=(mt.export_time?"Data from "+mt.export_time+" · ":"")+M.length+" Pokémon · use the tabs to transfer, build, and hunt";
 $("#nav").innerHTML=TABS.map(([k,l])=>`<button data-t="${k}">${l}</button>`).join("");
 $("#nav").onclick=ev=>{const t=ev.target.dataset.t;if(t)go(t)};go(R.briefing?"today":st.tab)}
function go(t){const same=st.tab===t,y=scrollY;st.tab=t;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
 $("#app").innerHTML=({settings,today,home,grade,raid,pvp,mega,max:maxb,showcase,depth,wish,plan,mons,power,out})[t]();bind();scrollTo(0,same?y:0)}
function bind(){const a=$("#app");
 a.querySelectorAll("[data-sf]").forEach(b=>b.onclick=()=>{st.sf=b.dataset.sf;go("showcase")});
 a.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{st.v=new Set([b.dataset.go]);st.shown=60;go("mons")});
 a.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>copy(b.dataset.cp,"Search copied — paste it in Pokémon GO"));
 if(st.tab==="mons"){const f=()=>{st.shown=60;grid()};
  $("#q").oninput=ev=>{st.q=ev.target.value;f()};$("#needs").onchange=ev=>{st.needs=ev.target.checked;f()};$("#elite").onchange=ev=>{st.elite=ev.target.checked;f()};
  const rd=$("#ready");if(rd)rd.onchange=ev=>{st.ready=ev.target.checked;f()};
  $("#sort").onchange=ev=>{st.sort=ev.target.value;f()};
  a.querySelectorAll("[data-v]").forEach(c=>c.onchange=()=>{c.checked?st.v.add(c.dataset.v):st.v.delete(c.dataset.v);f()});
  $("#csv").onclick=csv;$("#cps").onclick=()=>{const s=vis().map(o=>o.search).filter(Boolean).join(",");copy(s,"Copied "+s.split(",").length+" search terms")};grid()}
 a.querySelectorAll("[data-sl]").forEach(b=>b.onchange=()=>{const[k,id]=b.dataset.sl.split(":"),s=st.sl[k==="league"?"leagues":"cups"];b.checked?s.add(id):s.delete(id);go("settings")});
 a.querySelectorAll("[data-dlcfg]").forEach(b=>b.onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(cfgOut(),null,2)],{type:"application/json"})),l=document.createElement("a");l.href=u;l.download="pogo_config.json";l.click();toast("Saved - put it next to the sorter, then re-run")});
 a.querySelectorAll("[data-cpcfg]").forEach(b=>b.onclick=()=>{const c=cfgOut();navigator.clipboard&&navigator.clipboard.writeText('"leagues": '+JSON.stringify(c.pvp.leagues)+',\n"cups": '+JSON.stringify(c.pvp.cups));toast("Copied - paste inside the \"pvp\" block")});
 a.querySelectorAll("[data-hold]").forEach(b=>b.onclick=()=>{st.hold=b.dataset.hold;st.v=new Set(ORDER);st.q="";st.needs=st.elite=st.ready=false;go("mons")});
 a.querySelectorAll("[data-clearhold]").forEach(b=>b.onclick=()=>{st.hold=null;go("mons")});
 a.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>go(b.dataset.tab));
 a.querySelectorAll("[data-wk]").forEach(b=>b.onclick=()=>{st.wk=b.dataset.wk;st.wt="all";go("wish")});
 a.querySelectorAll("[data-wt]").forEach(b=>b.onclick=()=>{st.wt=b.dataset.wt;go("wish")});
 a.querySelectorAll("[data-rf]").forEach(b=>b.onclick=()=>{st.rf=b.dataset.rf;go("raid")});
 if(st.tab==="pvp")a.querySelectorAll("[data-lg]").forEach(b=>b.onclick=()=>{st.lg=+b.dataset.lg;go("pvp")});
 if(st.tab==="power")a.querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>{st.pl=b.dataset.pl;go("power")})}

/* ---------- HOME ---------- */
function home(){const CV=(G()&&G().coverage)||R.coverage||[];const c=R.counts||{},vc=c.verdicts||{},sp=c.special||{};
 const lab={mega_ready:"Mega ready",dynamax:"Dynamax",gigantamax:"Gigantamax",third_move:"3rd move candidates",shadow:"Shadow",purified:"Purified",protected:"Protected from transfer",super_mega:"Super Mega"};
 const rd=R.readiness&&R.readiness.status_counts;
 return `${tip("Overview","A snapshot of your bag. New players: start on <b>Today</b>, then <b>Transfer</b>, <b>Build plan</b>, and <b>Wishlist</b>.")}<h2>Your bag at a glance</h2><p class="sub">Tap a tile to see those Pokémon.</p>
 <div class="tiles">${ORDER.filter(v=>vc[v]!=null).map(v=>`<button class="tile" style="--c:${VC[v]}" data-go="${v}"><b>${num(vc[v])}</b><span>${VN[v]}</span></button>`).join("")}</div>
 ${rd?`<h2>Readiness of your builds</h2><p class="sub">What stands between each build and a usable moveset.</p><div class="pills">${STORDER.map(s=>`<span class="pill ${s==="Ready"?"ok":s==="Needs Elite TM"?"gap":""}"><b>${num(rd[s]||0)}</b>${s}</span>`).join("")}</div>`:""}
 <h2>Special finds</h2><div class="pills">${Object.keys(lab).filter(k=>sp[k]).map(k=>`<span class="pill"><b>${num(sp[k])}</b>${lab[k]}</span>`).join("")}</div>
 ${CV.length?`<h2>Raid type coverage</h2><p class="sub">Green = 3+ usable attackers, plain = thin (1-2), red = none. Open the Raid tab for the detail.</p><div class="pills">${CV.map(x=>`<span class="pill ${x.status==="OK"?"ok":x.status==="THIN"?"":"gap"}" title="${e((x.names||[]).join(", "))}"><span style="color:${tc(x.type)}">●</span> ${e(x.type)} · ${x.usable} ready</span>`).join("")}</div>`:""}
 ${holdPanel()}
 ${(R.audit||[]).length?`<h2>Self-check</h2><p class="sub">Confirms every tab reads the same numbers, and that <b>no Pokémon is recommended for use anywhere (teams, squads, Megas, buddy, tanks, power-ups, wishlist) while it is in REVIEW or on the transfer list</b>.</p><div class="pills"><span class="pill ${R.audit.every(a=>a.ok)?"ok":"gap"}"><b>${R.audit.filter(a=>a.ok).length}/${R.audit.length}</b>cross-tab checks passed</span></div>${R.audit.filter(a=>!a.ok).map(a=>`<div class="note">⚠ ${e(a.check)} — ${e(a.detail)}</div>`).join("")}`:""}
 <h2>Good to know</h2>${(R.notes||[]).map(n=>`<div class="note">${e(n)}</div>`).join("")}`}

/* ---------- POKEMON ---------- */
function mons(){const cnt={};M.forEach(m=>cnt[m.verdict]=(cnt[m.verdict]||0)+1);
 return `<h2>Pokémon</h2><p class="sub">Every Pokémon with its verdict, plan, readiness and the moves it knows right now (★ = elite / legacy move).</p>
 ${st.hold?`<div class="note">Showing only: <b>${e(((R.holding||[]).find(x=>x.key===st.hold)||{}).label||st.hold)}</b> <button class="btn sm" data-clearhold="1">Show all</button></div>`:""}
 <div class="bar">${ORDER.filter(v=>cnt[v]).map(v=>`<label class="chip" style="--c:${VC[v]}"><input type="checkbox" data-v="${v}" ${st.v.has(v)?"checked":""}><i></i>${VN[v]} ${cnt[v]}</label>`).join("")}</div>
 <div class="bar"><input id="q" type="search" placeholder="Search species, move, role, reason, status…" value="${e(st.q)}">
 <select id="sort">${[["build_status","Sort: Status"],["verdict","Sort: Verdict"],["cp","Sort: CP"],["iv_pct","Sort: IV %"],["level","Sort: Level"],["name","Sort: Name"]].map(([k,l])=>`<option value="${k}" ${st.sort===k?"selected":""}>${l}</option>`).join("")}</select>
 <label class="chip"><input type="checkbox" id="ready" ${st.ready?"checked":""}>Ready only</label>
 <label class="chip"><input type="checkbox" id="needs" ${st.needs?"checked":""}>Moves to fix</label><label class="chip"><input type="checkbox" id="elite" ${st.elite?"checked":""}>Has elite move</label>
 <button class="btn" id="cps">Copy in-game search</button><button class="btn" id="csv">Export CSV</button><span class="sub" id="count" style="margin:0"></span></div><div id="grid"></div>`}
function vis(){const q=st.q.toLowerCase().trim().split(/\s+/).filter(Boolean),k=st.sort;
 return M.filter(o=>st.v.has(o.verdict)&&q.every(t=>o.text.includes(t))&&(!st.needs||(o.moves_need||[]).length)&&(!st.elite||(o.moves||[]).some(x=>x.elite))&&(!st.ready||o.build_status==="Ready")&&(!st.hold||o.hold===st.hold))
 .sort((a,b)=>{if(k==="build_status"){const ai=STORDER.indexOf(a.build_status),bi=STORDER.indexOf(b.build_status);const an=ai<0?STORDER.length:ai,bn=bi<0?STORDER.length:bi;return an-bn||ORDER.indexOf(a.verdict)-ORDER.indexOf(b.verdict)||b.iv_pct-a.iv_pct}
  if(k==="verdict")return ORDER.indexOf(a.verdict)-ORDER.indexOf(b.verdict)||b.iv_pct-a.iv_pct;if(k==="name")return a.name.localeCompare(b.name);return b[k]-a[k]})}
function ivBar(l,v){return `<span>${l}</span><span class="tr"><i class="${v>=13?"":v>=8?"m":"l"}" style="width:${v/15*100}%"></i></span><em>${v}</em>`}

 if(!st.sl)st.sl={leagues:new Set(S.leagues),cups:new Set(S.cups)};

 const row=(kind,id,name,note)=>`<label class="row" style="cursor:pointer"><div><b>${e(name)}</b><small>${e(note)}</small></div><div class="r"><input type="checkbox" data-sl="${kind}:${e(id)}" ${st.sl[kind==="league"?"leagues":"cups"].has(id)?"checked":""} style="width:20px;height:20px"></div></label>`;

 <h2>Apply</h2><div class="panel"><div class="role">Right now (last run): ${S.leagues.map(x=>e((S.available_leagues.find(l=>l.id===x)||{}).name||x)).join(", ")||"none"}${S.cups.length?" · "+S.cups.map(x=>e((S.available_cups.find(c=>c.key===x)||{}).name||x)).join(", "):" · no cups"}</div>
  ${changed?'<div class="note" style="margin-top:10px">You have unsaved changes. A web page cannot edit files on your PC, so: <b>1)</b> download the config below, <b>2)</b> save it over <code>pogo_config.json</code> next to the sorter, <b>3)</b> run the sorter again.</div>':'<div class="role" style="margin-top:10px">No changes yet. Tick or untick above.</div>'}

 return `<h2>Account grade</h2>

 <div class="panels">${Object.entries(comps).map(([k,v])=>`<button class="panel tilep" data-tab="${goTab[k]}"><h3>${k.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase())}<span class="tag">${v.weight}%</span></h3>${pbar(v.pct,col)}<div class="role">${v.pct}% → ${v.weighted} pts</div><div class="role" style="margin-top:8px">${e(v.explain||"")}</div></button>`).join("")}</div>

/* ---------- PLACEMENT ---------- */
function placementPanel(kind){const P=(R.placement||{})[kind];if(!P)return"";const mv=P.moved||[];
 return `<details class="panel" style="margin:10px 0 16px"><summary><b>Placement:</b> every Pokémon has ONE home, chosen so coverage is as good as possible — <b>${P.covered_before} → ${P.covered_after}</b> of ${P.types} types can be covered once your planned builds are done · ${mv.length} Pokémon were re-homed</summary>
 <div class="role" style="margin:8px 0">Before, each Pokémon picked the type where its species ranks best, on its own. Now one global step fills every type's coverage first (Pokémon you can use today first, then ones you would level), then gives everything else its single best home, with a limit per type so none is flooded. TMs are assumed. A Mega-capable Pokémon counts either as an attacker or as the Mega, never both.</div>
 ${mv.map(m=>`<div class="row"><div><b>${e(m.name)}</b> <span class="mu">${e(m.iv)} · L${m.level}</span><small>${e(m.from)} → <b>${e(m.to)}</b> · ${e(m.why)}</small></div></div>`).join("")||'<div class="role">Nothing needed moving.</div>'}</details>`}
/* ---------- RAID ---------- */
function raid(){const g=G();if(!g||!g.sections)return noGrade;const S=g.sections.raid; const raidTip=tip("Raids","Group battles at gyms. Each type (Fire, Water, …) wants strong attackers of the types that beat it. Green = you have enough; red = a gap.");
 st.rf=st.rf||"all";const need=S.filter(x=>x.status!=="OK").length;
 const list=S.filter(x=>st.rf==="all"||(st.rf==="attention"?x.status!=="OK"||x.strength_pct<75:true)).sort((a,b)=>st.rf==="all"?a.type.localeCompare(b.type):({GAP:0,THIN:1,OK:2}[a.status]-{GAP:0,THIN:1,OK:2}[b.status]||a.strength_pct-b.strength_pct));
 return `${raidTip}<h2>Raid attackers</h2><p class="sub">Scored on coverage (3+ usable attackers per type, level ${(R.coverage_min&&"25")||"25"}+) and on how strong each type's team is next to the best attacker in the game for that type. A raid team is the Mega that boosts the type plus your 5 best attackers. <b>Each Pokémon counts in one type only</b>, placed to give the best overall coverage (see the Placement box); “Also decent as…” on a card shows alternatives. <b>Scores are “effective DPS”</b>: damage adjusted for bulk (the community ER method), so a fragile hard-hitter no longer beats a sturdy one. The “dps” figures here are on that scale.</p>
 <div class="pills" style="margin-bottom:12px"><span class="pill ${need?"gap":"ok"}"><b>${S.length-need}/${S.length}</b>types covered</span><span class="pill"><b>${(g.components.raid_coverage||{}).pct}%</b>raid score</span></div>
 ${placementPanel("raid")}
 <div class="tabs2">${[["all","All types"],["attention","Needs attention"]].map(([k,l])=>`<button class="chip" style="--c:var(--gold)" data-rf="${k}"><input type="checkbox" style="display:none" ${st.rf===k?"checked":""}>${l}</button>`).join("")}</div>
 <div class="panels">${list.map(x=>`<div class="panel" style="border-top:6px solid ${tc(x.type)}"><h3>${e(x.type)}<span>${stp(x.status)} ${lt(x.letter)}</span></h3>
  <div class="role">${x.usable} usable attacker${x.usable===1?"":"s"} (need 3) · team strength ${x.strength_pct}% of the best ${e(x.top_species)}</div>${pbar(x.strength_pct,LC[x.letter])}
  ${x.mega?`<div class="row"><div><b>${e(x.mega.name)}</b><span class="tag">Mega</span><small>Boost slot · IV ${e(x.mega.iv)}${x.mega.active?" · active now":""}</small></div><div class="r">${x.mega.dps} dps</div></div>`:'<div class="row"><div class="role">No Mega boost for this type</div></div>'}
  ${x.team.map((m,i)=>`${(m.slot==="backup"&&(i===0||x.team[i-1].slot!=="backup"))?'<div class="sub" style="margin:10px 0 2px">Backup · 6th slot if you skip the Mega</div>':""}<div class="row"><div><b>${e(m.name)}</b>${m.from?`<span class="tag">from ${e(m.from)}</span>`:""}${m.shadow?'<span class="tag">Shadow</span>':""}<small>${e(m.moveset)} · IV ${e(m.iv)} · CP ${m.cp} · L${m.level}</small>${m.moveset_note?`<small>${e(m.moveset_note)}</small>`:""}</div><div class="r">${m.dps} dps${pbar(100*m.dps/(x.top_dps||1))}</div></div>`).join("")||'<div class="role">No attackers yet.</div>'}
  ${x.fill_picks.length?`<div class="note" style="margin-top:10px"><b>Fastest way to fill the gap:</b> ${x.fill_picks.map(p=>`${e(p.name)}${p.evolve_to?" → "+e(p.evolve_to):""} ${e(p.iv)} (L${p.level}, ${num(p.dust)} dust to L25)`).join("; ")}</div>`:""}
  ${(x.flex||[]).length?`<details style="margin-top:8px" ${x.usable<3?"open":""}><summary>Also decent as ${e(x.type)} (${x.flex.length}) — used better elsewhere</summary><div class="role" style="margin:6px 0">Each Pokémon has <b>one</b> home, chosen to give the best overall coverage, so these are deliberately <i>not</i> counted here. They are the next-best option if you want to move one (it needs the right moves, so a TM).</div>${x.flex.map(f=>`<div class="row"><div><b>${e(f.name)}</b>${f.to?`<span class="tag">→ ${e(f.to)}</span>`:""}${f.shadow?'<span class="tag">Shadow</span>':""}<small>IV ${e(f.iv)} · L${f.level} · ${e(f.verdict)}</small><small>Placed as ${e(f.assigned||"—")}${f.assigned_score?` (${f.assigned_score})`:""} → as ${e(x.type)}: <b>${f.score}</b></small></div><div class="r">${f.pct}%<br><span class="mu">of best</span></div></div>`).join("")}</details>`:""}
  ${x.wish.length?`<details style="margin-top:8px"><summary>Upgrades worth hunting (${x.wish.length})</summary>${x.wish.map(r=>wrow(r,"raid")).join("")}<div style="margin-top:6px">${tabLink("wish","Full "+e(x.type)+" wishlist")}</div></details>`:""}</div>`).join("")}</div>`}

function pvp(){const g=G();if(!g||!g.sections)return noGrade;const S=g.sections.pvp;if(!S.length)return '<div class="empty">No PvP data.</div>';

 <div class="pills" style="margin-bottom:12px"><span class="pill"><b>${c.pct}%</b>PvP readiness</span>${S.filter(x=>!x.is_cup).map(x=>`<span class="pill"><b>${x.distinct_teams}/5</b>${e(x.league)} teams</span>`).join("")}</div>
 <div class="tabs2">${S.map((l,i)=>`<button class="chip" style="--c:var(--gold)" data-lg="${i}"><input type="checkbox" style="display:none" ${i===st.lg?"checked":""}>${e(l.league)}${l.is_cup?"":" League"} · ${l.cap}</button>`).join("")}</div>
 <div class="panels" style="margin-bottom:14px"><div class="panel"><h3>${e(lg.league)}<span>${lt(lg.best_grade)}</span></h3>
  <div class="row"><div>Different teams<small>${lg.distinct_teams} of 5 for full marks</small></div><div class="r">${lg.team_score_pct}%</div></div>
  <div class="row"><div>Builds finished<small>${lg.builds.length} PvP builds; Ready counts 100%, Needs TM 80%, Elite TM 40%</small></div><div class="r">${lg.completion_pct}%</div></div>
  <div class="role" style="margin-top:6px">Matchups: ${e(lg.threat_source||"n/a")}</div></div></div>
 <h2>Teams</h2><div class="panels">${lg.teams.map(t=>{const c=t.cohesion||{},p=c.parts;return `<div class="panel"><h3>Team ${t.n}${lt(c.grade)}</h3><div class="role">Score ${t.score}${c.coverage_pct!=null?" · covers "+c.coverage_pct+"% of the meta":""}</div>
  ${t.members.map(m=>`<div class="row"><div><b>${e(m.name)}</b>${m.shadow?'<span class="tag">Shadow</span>':""}${m.mega?'<span class="tag">Mega-capable</span>':""}${m.evolve_from?`<span class="tag">from ${e(m.evolve_from)}</span>`:""}<small>${e(m.role||"")} · IV ${e(m.iv)} · species #${m.sp_rank||"?"} · IV rank #${m.iv_rank||"?"}</small></div><div class="r">CP ${m.target_cp||m.cp}<br><span class="mu">L${m.level||"?"}</span></div></div>`).join("")}
  ${p?`<details style="margin-top:8px"><summary>Why this grade</summary>${Object.entries(p).map(([k,v])=>`<div class="row"><div>${e(k)}</div><div class="r" style="width:40%">${Math.round(v*100)}%${pbar(v*100)}</div></div>`).join("")}${(c.holes||[]).length?`<p><b>Weak spots:</b> ${c.holes.slice(0,5).map(h=>`${e(h.name)} beats ${e((h.beats||[]).join(", "))}`).join("; ")}</p>`:""}${c.coverage_note?`<p class="role">${e(c.coverage_note)}</p>`:""}</details>`:""}</div>`}).join("")||'<div class="empty">No teams generated for this league.</div>'}</div>
 <h2>PvP builds in ${e(lg.league)}</h2><div class="panel">${lg.builds.map(b=>`<div class="row"><div><b>${e(b.species)}</b> <span class="mu">CP ${b.cp} · ${e(b.iv)}</span><small>${e(b.role)}</small>${b.needs.length?`<small style="color:var(--warn)">needs ${e(b.needs.join(", "))}</small>`:""}</div><div class="r"><span class="st" data-s="${e(b.status)}">${e(b.status)}</span><br>${cpb(b.search)}</div></div>`).join("")||'<div class="role">No builds target this league.</div>'}</div>
 <h2>Wishlist — top ${lg.wish.length} for ${e(lg.league)}</h2><p class="sub">The meta's best species, and how good your best copy is. HAVE = IV rank within your keep line.</p><div class="panel">${lg.wish.map(r=>wrow(r,"pvp")).join("")||'<div class="role">No ranking data.</div>'}</div>`}

function mega(){const g=G();if(!g||!g.sections)return noGrade;const S=g.sections.mega,c=g.components.mega_coverage||{};
 return `<h2>Mega boosts</h2><p class="sub">Scored on how many of the 18 raid types you have a Mega boost for. A Mega boosts every raid attacker that shares one of its types.</p>
 <div class="pills" style="margin-bottom:12px"><span class="pill ${S.covered===S.total?"ok":"gap"}"><b>${S.covered}/${S.total}</b>types boosted</span><span class="pill"><b>${c.pct}%</b>mega score</span></div>
 <div class="pills">${S.types.map(t=>`<span class="pill ${t.covered?"ok":"gap"}" title="${e(t.forms.join(", "))}">${tdot(t.type)} ${e(t.type)} · ${t.forms.length}</span>`).join("")}</div>
 <h2>Your Megas</h2><div class="panels">${S.priority.map(m=>`<div class="panel"><h3>${e(m.form)}</h3><div class="role">Your ${e(m.mine)} · CP ${m.cp} · IV ${e(m.iv)} (${m.iv_pct}%)</div><div style="margin-top:8px">${(m.tags||[]).map(x=>`<span class="tag">${e(x)}</span>`).join("")}</div></div>`).join("")||'<div class="empty">No Megas.</div>'}</div>

function maxSupport(){const B=R.max_battle;if(!B)return"";
 const lv=B.attack_levels||{},lvT=Object.entries(lv).map(([k,n])=>`${n} at level ${k}`).join(" · ");
 const row=(p,kind)=>`<div class="row"><div><b>${e(p.species)}</b>${p.evolves_to?`<span class="tag">→ ${e(p.evolves_to)}</span>`:""}<small>IV ${e(p.iv)} · CP ${p.cp} · L${p.level} · bulk ${p.pct_of_best}% of your best</small>${p.unlocked?`<small>${kind} level ${p.move_level}</small>`:`<small style="color:var(--warn)">${e(p.need)}</small>`}</div><div class="r">${sChip(p.unlocked?"HAVE":"HUNT")}</div></div>`;
 return `<h2>Max Moves &amp; support</h2><p class="sub">Max damage = Attack × Max Move power × STAB (the same-type bonus). Power is 250 / 300 / 350 by Max Move level (G-Max: 350 / 400 / 450), and attackers are ranked as if their Max Move were level 3. Tanks and healers are ranked by bulk and max HP among your Dynamax Pokémon.</p>
 <div class="panels"><div class="panel"><h3>Max Move levels</h3><div class="role">${B.dynamax} Dynamax · ${B.gigantamax} Gigantamax</div><div class="role">Attack Max Move: ${e(lvT)}</div>
  ${B.attackers_below_3?`<div class="note" style="margin-top:8px"><b>${B.attackers_below_3} of your ${B.attackers} Max attackers</b> have their attack Max Move below level 3. Levelling it adds <b>+${B.gain_pct}% damage</b> with no new Pokémon needed (costs Max Particles + candy).</div>`:'<div class="role">Your Max attackers are at level 3.</div>'}</div>
  <div class="panel"><h3>Max Guard &amp; Max Spirit</h3><div class="role">Max Guard unlocked on <b>${B.guard_unlocked}</b> of ${B.dynamax}</div><div class="role">Max Spirit unlocked on <b>${B.spirit_unlocked}</b> of ${B.dynamax}</div><div class="role" style="margin-top:6px">A tank or healer pick only helps once its Guard / Spirit is unlocked.</div></div></div>
 <div class="panels"><div class="panel"><h3>Best tanks</h3>${(B.tanks||[]).map(p=>row(p,"Max Guard")).join("")||'<div class="role">No Dynamax tank candidates.</div>'}</div>
  <div class="panel"><h3>Best healers</h3>${(B.healers||[]).map(p=>row(p,"Max Spirit")).join("")||'<div class="role">No Dynamax healer candidates.</div>'}</div></div>
 <h2>Attackers by type</h2>`}
/* ---------- MAX ---------- */
function maxb(){const g=G();if(!g||!g.sections)return noGrade;const S=g.sections.max,c=g.components.max_battle||{}; const maxTip=tip("Max Battles ≠ raids","Only <b>Dynamax / Gigantamax</b> Pokémon count here. A normal Electivire does not fill Max Electric. The <b>fast move type</b> matters — e.g. Charm is Fairy, not Electric.");

 <div class="pills" style="margin-bottom:12px"><span class="pill ${S.covered===S.total?"ok":"gap"}"><b>${S.covered}/${S.total}</b>types covered</span><span class="pill"><b>${c.pct}%</b>max score</span></div>
 ${placementPanel("max")}${maxSupport()}<div class="panels">${S.types.map(t=>`<div class="panel" style="border-top:6px solid ${tc(t.type)}"><h3>${e(t.type)}<span>${t.covered?`<span class="tag">${t.have_pct}% of top pick</span>`:stp("GAP")}</span></h3>
  ${t.team.map(m=>`<div class="row"><div><b>${e(m.name)}</b><small>IV ${e(m.iv)}</small></div><div class="r">${m.dps} dps</div></div>`).join("")||'<div class="role">No Dynamax attacker of this type.</div>'}
  ${t.wish.length?`<details style="margin-top:8px" ${t.covered?"":"open"}><summary>Best adds (${t.wish.length})</summary>${t.wish.map(r=>wrow(r,"max")).join("")}</details>`:""}</div>`).join("")}</div>`}

function showcase(){
 const S=R.showcase;if(!S||!S.enabled)return tip("Showcase","Showcase scoring is off or missing from this report. Re-run the sorter with the latest files.")+'<div class="empty">No showcase data.</div>';

 <div class="panels" style="margin-top:10px"><div class="panel"><h3>XXL</h3><div style="font:700 28px var(--hd)">${S.xxl_count||0}</div></div><div class="panel"><h3>Scored</h3><div style="font:700 28px var(--hd)">${S.scored_count||0}</div></div></div>
 <div class="wrap" style="margin-top:10px"><table><thead><tr><th>#</th><th>Pokémon</th><th>Score</th><th>Size</th><th>IV</th><th>CP</th><th>Verdict</th></tr></thead><tbody>

 </tbody></table></div>`}

 return `<h2>Collection depth</h2><p class="sub">${e(c.explain||"")}</p>
 <div class="panels">${d.parts.map(p=>`<div class="panel"><h3>${e(p.label)}<span class="tag">${p.weight}%</span></h3>${pbar(p.pct)}<div class="role">${p.pct}% — ${e(p.text)}</div></div>`).join("")}</div>

/* ---------- WISHLIST ---------- */
function wish(){const g=G();if(!g||!g.wishlist_all)return noGrade;const W=g.wishlist_all; const wishTip=tip("What to hunt","Pokémon worth looking for when walking, hatching, or raiding. Higher on the list = bigger upgrade for <b>your</b> account.");
 const kinds=[["raid","Raid attackers"],["pvp","PvP"],["mega","Mega"],["max","Max Battle"]];st.wk=st.wk||"raid";st.wt=st.wt||"all";
 const head=`<h2>Wishlist</h2><p class="sub">The best Pokémon in every type and league next to what you own — so you can see what to hunt even when a team looks full. Raid scores use effective DPS (damage with a bulk adjustment). HAVE = you own a copy that is good enough · UPGRADE = you own it but a better copy or version helps · HUNT = not owned · <b>DECIDE</b> = you own a copy but it is in REVIEW, so settle that first (a REVIEW Pokémon never counts as “have it”).</p>
 <div class="tabs2">${kinds.map(([k,l])=>`<button class="chip" style="--c:var(--gold)" data-wk="${k}"><input type="checkbox" style="display:none" ${st.wk===k?"checked":""}>${l}</button>`).join("")}</div>`;
 if(st.wk==="pvp"){const idx=st.wt==="all"||isNaN(+st.wt)?0:+st.wt,L=W.pvp[idx]||W.pvp[0];
  return head+typeChips(W.pvp.map((l,i)=>[String(i),e(l.league)]),String(idx),"data-wt")+`<div class="panel">${L.rows.map(r=>wrow(r,"pvp")).join("")}</div>`}
 const M=W[st.wk],keys=Object.keys(M).sort();
 const mini=(t)=>{const b=M[t],rows=b.rows||[],n=s=>rows.filter(r=>r.status===s).length;
  return `${wishTip}<div class="panel" style="border-top:6px solid ${tc(b.type)}"><h3>${e(b.type)}<span>${b.status?stp(b.status):""}</span></h3><div class="role">${n("HAVE")} have · ${n("UPGRADE")+n("NO DYNAMAX")} upgrade · ${n("HUNT")} hunt${b.have_pct!=null?" · your best "+b.have_pct+"% of top":""}</div>
  ${rows.filter(r=>r.status!=="HAVE").slice(0,5).map(r=>`<div class="row"><div><b>${r.rank}. ${e(r.species)}</b></div><div class="r">${sChip(r.status)}</div></div>`).join("")||'<div class="role">You hold the top picks.</div>'}<div style="margin-top:8px"><button class="btn sm" data-wt="${t}">Open all ${rows.length}</button></div></div>`};
 const body=st.wt==="all"||!M[st.wt]?`<div class="panels">${keys.map(mini).join("")}</div>`:`<div class="panel" style="border-top:6px solid ${tc(M[st.wt].type)}"><h3>${e(M[st.wt].type)}${M[st.wt].status?stp(M[st.wt].status):""}</h3>${M[st.wt].rows.map(r=>wrow(r,st.wk)).join("")}</div>`;
 return head+typeChips([["all","Overview"]].concat(keys.map(k=>[k,e(M[k].type),tc(M[k].type)])),st.wt,"data-wt")+body}

/* ---------- BUILD PLAN ---------- */
function plan(){const g=G();if(!g)return noGrade;const tm=g.tm_here||{regular:[],elite_worth:[],elite_skip:{}},kp=g.keep_summary||{counts:{}};
 const lv=(g.level_these||[]).filter(r=>((r.cost||{}).dust||0)>0||(r.tm_needed||[]).length||r.evolve_to);
 const dust=((R.budget||{}).stardust);
 const cheap=lv.filter(r=>!dust||((r.cost||{}).dust||0)<=dust);
 const later=lv.filter(r=>dust&&((r.cost||{}).dust||0)>dust);
 const tmF=[...(tm.elite_worth||[]).slice(0,3),...(tm.regular||[]).slice(0,5)];
 const row=(r,i)=>`<div class="row"><div><b>${i+1}. ${e(r.species)} ${e(r.iv)}</b><span class="mu" style="margin-left:8px">CP ${r.cp} · L${r.level}${r.evolve_to?" → "+e(r.evolve_to):""}${r.power_up_to?" → L"+e(r.power_up_to):""}</span>${r.gap_fix?`<span class="tag" style="background:#ff5a5f;color:#fff">fills ${e(r.gap_type)} gap</span>`:""}<small>${e(r.role)}</small><small>Moves: ${mvs(r.moves)}${(r.tm_needed||[]).length?" · <b>needs TM: "+e(r.tm_needed.join(", "))+"</b>":""}${dustTxt(r.cost)?" · "+e(dustTxt(r.cost)):""}</small>${(r.why||[]).length?`<details><summary>Why?</summary><ul style="margin:6px 0 0 18px;padding:0">${r.why.map(x=>`<li>${e(x)}</li>`).join("")}</ul></details>`:""}</div><div class="r">${r.impact!=null?"priority "+r.impact+"<br>":""}${cpb(r.search)}</div></div>`;
 // leftover PvP power list (only real spends)
 const gl=((R.priority||{}).glul||[]).filter(r=>(r.dust||0)>0).slice(0,8);
 return `${tip("Stardust & candy","Powering up makes a Pokémon stronger for battles. It costs <b>Stardust</b> and <b>candy</b>. Cheap upgrades that fix raid/Max gaps rank higher than expensive PvP projects that need lots of XL candy.")}
 <h2>Build plan</h2><p class="sub">What to spend resources on, best first. Prefer the affordable list if Stardust is low.</p>
 ${dust!=null?`<div class="role" style="margin-bottom:10px">You have about <b>${num(dust)}</b> Stardust right now.</div>`:""}
 <h2>Do these first (${cheap.length})</h2><div class="panel">${cheap.slice(0,15).map(row).join("")||'<div class="role">Nothing affordable right now — farm Stardust, or check the later list.</div>'}</div>
 ${later.length?`<h2>When you have more Stardust (${later.length})</h2><div class="panel">${later.slice(0,12).map(row).join("")}</div>`:""}
 <h2>TMs worth using (${tmF.length})</h2><p class="sub">A TM changes a move. Use these when the Pokémon is already worth keeping.</p><div class="panel">${tmF.map(r=>`<div class="row"><div><b>${e(r.species)}</b> CP ${r.cp}<small>${e(r.needs||r.role||"")}</small></div><div class="r">${cpb(r.search)}</div></div>`).join("")||'<div class="role">No TM fixes queued.</div>'}</div>
 ${gl.length?`<h2>PvP power-ups (optional)</h2><p class="sub">Only if you play Great League. Skip while raid coverage is thin or Stardust is low.</p><div class="panels">${gl.map(r=>`<div class="panel"><h3>${e(r.species)}<span class="tag">${e(r.tag||r.league)}</span></h3><div class="role">CP ${r.cp} · IV ${e(r.iv)} · Great rank #${r.species_rank}</div><div class="row"><div>Level ${r.from} → ${r.to}</div><div class="r">${num(r.dust)} dust<br>${num(r.candy)} candy${r.xl?" · "+r.xl+" XL":""}</div></div></div>`).join("")}</div>`:""}
 <h2>Ready to evolve</h2>${(R.evolve||[]).length?`<p class="sub">${R.evolve.length} Pokémon worth evolving (usually cheap).</p><div class="panels">${R.evolve.slice(0,20).map(r=>`<div class="panel"><h3>${e(r.species)} → ${e(r.target)}</h3><div class="role">CP ${r.cp} · IV ${e(r.iv)}</div><div class="role">${e(r.role||"")}</div></div>`).join("")}</div>`:'<div class="role">None queued.</div>'}
 <h2>Protected core</h2><p class="sub">These are already locked as keepers — not transfer targets.</p><div class="panels">${Object.entries(kp.counts||{}).map(([k,v])=>`<div class="panel"><h3>${e(k)}</h3><div style="font:700 36px var(--hd);color:var(--gold)">${v}</div></div>`).join("")}<div class="panel"><h3>Total protected</h3><div style="font:700 36px var(--hd);color:var(--gold)">${kp.total_protected||0} / ${kp.total||0}</div></div></div>`}

function power(){const P=R.priority||{},K=[["ml","Master League"],["glul","Great & Ultra"],["dn","Do not invest"]].filter(k=>k[0]==="dn"||(P[k[0]]||[]).length);st.pl=K.some(k=>k[0]===st.pl)?st.pl:K[0][0];
 const rows=(P[st.pl]||[]).slice(0,40);const b=R.budget||{},tt=b.totals||{};
 return `<h2>Power-up priority</h2><p class="sub">Where your Stardust and candy will do the most good.${tt.dust_needed?` Building every recommended Pokémon needs about <b>${num(tt.dust_needed)}</b> Stardust.`:""}</p>
 <div class="tabs2">${K.map(([k,l])=>`<button class="chip" style="--c:var(--gold)" data-pl="${k}"><input type="checkbox" style="display:none" ${st.pl===k?"checked":""}>${l}</button>`).join("")}</div>
 <div class="panels">${rows.map(r=>`<div class="panel"><h3>${e(r.species)}<span class="tag">${e(r.tag||r.league)}</span></h3><div class="role">CP ${r.cp} · IV ${e(r.iv)} · IV rank #${num(r.iv_rank)} · ${e(r.league)} rank #${r.species_rank}</div>
 <div class="row"><div>Level ${r.from} → ${r.to}<small>target CP ${num(r.target_cp)}</small></div><div class="r">${num(r.dust)} dust<br>${num(r.candy)} candy${r.xl?" · "+r.xl+" XL":""}</div></div></div>`).join("")||'<div class="empty">Nothing here.</div>'}</div>
 ${(R.evolve||[]).length?`<h2>Ready to evolve</h2><p class="sub">${R.evolve.length} Pokémon worth evolving.</p><div class="panels">${R.evolve.slice(0,30).map(r=>`<div class="panel"><h3>${e(r.species)} → ${e(r.target)}</h3><div class="role">CP ${r.cp} · IV ${e(r.iv)} (${r.iv_pct}%)</div><div style="margin:6px 0"><span class="tag">${r.candy} candy</span>${r.via?`<span class="tag">via ${e(r.via)}</span>`:""}${r.item?`<span class="tag">${e(r.item)}</span>`:""}</div><div class="role">${e(r.role)}</div></div>`).join("")}</div>`:""}`}

/* ---------- TRANSFER ---------- */
function out(){const T=R.transfer||{groups:[]};
 return `${tip("What is Transfer?","Transfer means removing a Pokémon from your box for candy. Only Pokémon the sorter thinks are safe are listed. Skip anything shiny, with a special background, or that you like.")}
 <h2>Transfer list</h2><p class="sub">${T.total||0} safe to transfer · ${T.protected||0} protected. Tap <b>Copy search</b>, paste into Pokémon GO’s search box, then transfer. When unsure — keep it.</p>
 <div class="bar"><button class="btn pri" data-cp="${e(T.groups.flatMap(g=>g.rows.map(r=>r.search)).join(","))}">Copy search for all</button></div>
 <div class="panels">${T.groups.map(g=>`<div class="panel"><h3>${e(g.species)}<span class="tag">${g.count}</span></h3>${g.rows.map(r=>`<div class="row"><div>CP ${r.cp} · IV ${e(r.iv)} (${r.iv_pct}%)<small>Level ${r.level}${r.warn?" · ⚠ "+e(r.warn):""}</small></div></div>`).join("")}
 <button class="btn" style="margin-top:8px" data-cp="${e(g.rows.map(r=>r.search).join(","))}">Copy search</button></div>`).join("")}</div>`}

if(window.__REPORT__)init(window.__REPORT__);
else{$("#meta").textContent="No data loaded yet";$("#app").innerHTML=`<div class="drop"><h2>Drop in report.json</h2><p class="sub">Run <code>python3 pogo_sorter.py</code> and the sorter will fill this page for you. Or choose the report.json it created:</p><label class="btn pri">Choose report.json<input type="file" id="fi" accept=".json" hidden></label></div>`;
 $("#fi").onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{init(JSON.parse(r.result))}catch(x){toast("That file isn't a valid report.json")}};r.readAsText(f)}}
</script></body></html>
